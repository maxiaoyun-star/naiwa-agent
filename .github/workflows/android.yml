name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_llama:
        description: "是否编译 llama.cpp 原生库（生成 libllama.so 并打进 APK）"
        type: boolean
        default: true
      model_url:
        description: "预置模型下载直链（可选，会写进 APK 的默认配置）"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 单元测试
  test:
    name: 单元测试（纯标准库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行测试
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------- 构建 APK
  apk:
    name: 构建 debug APK
    runs-on: ubuntu-22.04
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev build-essential ccache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: 环境信息
        run: |
          {
            echo "### 构建环境"
            echo '```'
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
            echo "--- ndk dir ---"
            ls "${ANDROID_HOME}/ndk" 2>/dev/null || echo "(no ndk dir)"
            echo "--- java ---"
            java -version 2>&1 | head -n 3 || true
            echo "--- python ---"
            python --version || true
            echo "--- buildozer ---"
            buildozer --version 2>&1 | head -n 2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # buildozer 会把 SDK/NDK/依赖源码下到 ~/.buildozer，缓存它能把重建压到 10 分钟左右
      - name: 缓存 buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # llama.cpp 用 NDK 交叉编译成 arm64 的 .so，再由 buildozer 的
      # android.add_libs_arm64_v8a 打进 APK。失败不阻塞打包：App 会降级为 API 模式。
      - name: 编译 llama.cpp（arm64）
        if: github.event.inputs.build_llama != 'false'
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_DIR="$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | head -n1 || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "未找到预装 NDK，现场安装 25.2.9519653"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" >/dev/null
            NDK_DIR="$ANDROID_HOME/ndk/25.2.9519653"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          chmod +x scripts/build_llama_android.sh
          {
            echo "### llama.cpp 编译"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if scripts/build_llama_android.sh 2>&1 | tee llama-build.log; then
            echo "OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAILED（APK 仍会产出，端侧推理降级为 API 模式）" >> "$GITHUB_STEP_SUMMARY"
            echo "--- tail ---" >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 llama-build.log >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 即使 llama.cpp 没编出来也要保证目录存在：buildozer 的 android.add_libs_* 指向
      # 不存在的目录会直接让构建失败。没有 .so 时索性把这一行从 spec 里删掉。
      - name: 准备原生库目录
        run: |
          mkdir -p libs/arm64-v8a
          if compgen -G "libs/arm64-v8a/*.so" > /dev/null; then
            echo "找到原生库，保留 add_libs 配置"
            ls -la libs/arm64-v8a
          else
            echo "没有原生库，移除 add_libs 配置（APK 将只有 API 模式）"
            sed -i '/^android\.add_libs_arm64_v8a/d' buildozer.spec
          fi

      - name: 写入可选默认模型地址
        if: github.event.inputs.model_url != ''
        run: |
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path("naiwa/defaults.py")
          url = os.environ["MODEL_URL"]
          text = p.read_text(encoding="utf-8")
          text = text.replace('DEFAULT_MODEL_URL = ""', f'DEFAULT_MODEL_URL = "{url}"')
          p.write_text(text, encoding="utf-8")
          print("已写入默认模型地址:", url)
          PY
        env:
          MODEL_URL: ${{ github.event.inputs.model_url }}

      # 构建日志同时写进运行摘要：公开仓库的 Actions 日志需要登录才能看，
      # 但运行摘要（Summary）是匿名的，这样失败原因永远可见。
      - name: buildozer android debug
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee buildozer.log
          code=${PIPESTATUS[0]}
          echo "$code" > buildozer.exit
          if [ "$code" -ne 0 ]; then
            {
              echo "### buildozer 失败（exit ${code}）"
              echo '```'
              tail -n 150 buildozer.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          cp bin/*.apk out/ 2>/dev/null || true
          cp buildozer.log llama-build.log out/ 2>/dev/null || true
          ls -lh out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naiwa-agent-debug-apk
          path: |
            out/*.apk
            out/*.log
          if-no-files-found: warn
          retention-days: 30
